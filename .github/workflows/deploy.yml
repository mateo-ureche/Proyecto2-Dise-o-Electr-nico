name: Deploy to Multiple AWS EC2

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'android-app/**'

jobs:
  deploy-mateo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Deploy to Mateo AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_KEY }}
          script: |
            cd /home/ubuntu/proyecto2
            git pull origin main
            ./actualizar.sh

  deploy-naeem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Deploy to Naeem AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST_NAEEM }}
          username: ubuntu
          key: ${{ secrets.AWS_KEY_NAEEM }}
          script: |
            cd /home/ubuntu/proyecto2
            git pull origin main
            ./actualizar.sh

  deploy-diana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Deploy to Diana AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST_DIANA }}
          username: ubuntu
          key: ${{ secrets.AWS_KEY_DIANA }}
          script: |
            cd /home/ubuntu/proyecto2
            git pull origin main
            ./actualizar.sh