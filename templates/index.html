<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker - {{ dominio }}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }
        .contenedor {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }
        .encabezado { text-align: center; margin-bottom: 20px; }
        .encabezado h1 { margin: 0; font-size: 28px; }
        .encabezado p { margin-top: 8px; color: #64748b; }
        .datos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }
        .campo {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
        }
        .etiqueta {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .valor { font-size: 18px; font-weight: bold; color: #0f172a; }
        #mapa {
            width: 100%;
            height: 400px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }
        .estado {
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            font-size: 14px;
        }
        .punto {
            display: inline-block;
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <h1>📍 GPS Tracker (Naeem es Qle gay) </h1>
            <p>Ubicación en tiempo real del vehículo</p>
            <p style="font-size: 12px; color: #94a3b8;">{{ dominio }}</p>
        </div>

        <div class="datos">
            <div class="campo">
                <span class="etiqueta">LATITUD</span>
                <span class="valor" id="latitud">---</span>
            </div>
            <div class="campo">
                <span class="etiqueta">LONGITUD</span>
                <span class="valor" id="longitud">---</span>
            </div>
            <div class="campo">
                <span class="etiqueta">FECHA</span>
                <span class="valor" id="fecha">---</span>
            </div>
            <div class="campo">
                <span class="etiqueta">HORA</span>
                <span class="valor" id="hora">---</span>
            </div>
        </div>

        <div id="mapa"></div>

        <div class="estado">
            <span class="punto"></span>
            Actualización automática cada 10 segundos
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let mapa = L.map('mapa').setView([10.9878, -74.7889], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(mapa);

        // ¡NUEVO!: Añadimos la polilínea azul vacía al mapa
        let polilinea = L.polyline([], {color: 'blue', weight: 4}).addTo(mapa);
        let marcador = L.marker([10.9878, -74.7889]).addTo(mapa);

        function actualizarUbicacion() {
            fetch("/api/ubicacion")
                .then(respuesta => respuesta.json())
                .then(datos => {
                    // Ahora 'datos' es una lista, así que verificamos que tenga elementos
                    if (datos && datos.length > 0) {
                        
                        // 1. Extraemos el último punto de la lista (el más reciente)
                        let ultimoPunto = datos[datos.length - 1];

                        // 2. Actualizamos los textos en la página con el último punto
                        document.getElementById("latitud").textContent = ultimoPunto.latitud ?? "---";
                        document.getElementById("longitud").textContent = ultimoPunto.longitud ?? "---";
                        document.getElementById("fecha").textContent = ultimoPunto.fecha ?? "---";
                        document.getElementById("hora").textContent = ultimoPunto.hora ?? "---";

                        // 3. Verificamos que tenga coordenadas válidas
                        if (ultimoPunto.latitud && ultimoPunto.longitud) {
                            
                            // Transformamos toda la lista de datos en una lista de coordenadas [lat, lon]
                            let coordenadasRuta = datos.map(p => [p.latitud, p.longitud]);
                            
                            // Trazamos la línea azul en el mapa
                            polilinea.setLatLngs(coordenadasRuta);
                            
                            // Movemos el pin y centramos la cámara al punto más nuevo
                            const nuevaPos = [ultimoPunto.latitud, ultimoPunto.longitud];
                            marcador.setLatLng(nuevaPos);
                            mapa.setView(nuevaPos);
                        }
                    }
                })
                .catch(error => console.error("Error:", error));
        }

        actualizarUbicacion();
        setInterval(actualizarUbicacion, 10000);
    </script>
</body>
</html>
