<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker - {{ dominio }}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            overflow: hidden;
        }
        .contenedor {
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }
        .encabezado {
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .encabezado h1 { margin: 0; font-size: 22px; }
        .encabezado p { margin-top: 4px; color: #64748b; font-size: 14px; }
        .datos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .campo {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
        }
        .etiqueta {
            display: block;
            color: #64748b;
            font-size: 11px;
            margin-bottom: 2px;
            font-weight: bold;
        }
        .valor { font-size: 15px; font-weight: bold; color: #0f172a; }
        .estado {
            text-align: center;
            margin-bottom: 10px;
            color: #64748b;
            font-size: 12px;
            flex-shrink: 0;
        }
        .punto {
            display: inline-block;
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
        }
        #mapa {
            flex: 1;
            min-height: 0;
            width: 100%;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <h1>📍 GPS Tracker</h1>
            <p>Ubicación en tiempo real del vehículo</p>
            <p style="font-size: 12px; color: #94a3b8;">{{ dominio }}</p>
        </div>

        <div class="datos">
            <div class="campo">
                <span class="etiqueta">LATITUD</span>
                <span class="valor" id="latitud">---</span>
            </div>
            <div class="campo">
                <span class="etiqueta">LONGITUD</span>
                <span class="valor" id="longitud">---</span>
            </div>
            <div class="campo">
                <span class="etiqueta">FECHA</span>
                <span class="valor" id="fecha">---</span>
            </div>
            <div class="campo">
                <span class="etiqueta">HORA</span>
                <span class="valor" id="hora">---</span>
            </div>
        </div>

        <div class="estado">
            <span class="punto"></span>
            Actualización automática cada 10 segundos
        </div>

        <div id="mapa"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let mapa = L.map('mapa').setView([10.9878, -74.7889], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(mapa);

        let marcador = L.marker([10.9878, -74.7889]).addTo(mapa);
        let lineaRecorrido = L.polyline([], { color: '#2563eb', weight: 4 }).addTo(mapa);
        let primeraCarga = true;

        function distanciaMetrosAprox(p1, p2) {
            const dLat = (p2[0] - p1[0]) * 111000;
            const dLon = (p2[1] - p1[1]) * 111000 * Math.cos(p1[0] * Math.PI / 180);
            return Math.sqrt(dLat * dLat + dLon * dLon);
        }

        function construirRutaFiltrada(puntosCrudos) {
            const ruta = [];
            let rechazosSeguidos = 0;
            for (const p of puntosCrudos) {
                const lat = Math.round(p.latitud * 10000) / 10000;
                const lon = Math.round(p.longitud * 10000) / 10000;
                const nuevoPunto = [lat, lon];
                const anterior = ruta[ruta.length - 1];

                if (!anterior) {
                    ruta.push(nuevoPunto);
                    continue;
                }

                const esDistinto = anterior[0] !== nuevoPunto[0] || anterior[1] !== nuevoPunto[1];
                if (!esDistinto) continue;

                const esRazonable = distanciaMetrosAprox(anterior, nuevoPunto) < 500;
                if (esRazonable) {
                    ruta.push(nuevoPunto);
                    rechazosSeguidos = 0;
                } else {
                    rechazosSeguidos++;
                    if (rechazosSeguidos >= 2) {
                        ruta.length = 0;
                        ruta.push(nuevoPunto);
                        rechazosSeguidos = 0;
                    }
                }
            }
            return ruta;
        }

        function dibujarRuta(ruta) {
            lineaRecorrido.setLatLngs(ruta);
        }

        function actualizarRecorrido() {
            fetch("/api/recorrido")
                .then(r => r.json())
                .then(puntosCrudos => {
                    const ruta = construirRutaFiltrada(puntosCrudos);
                    dibujarRuta(ruta);

                    if (primeraCarga && ruta.length > 0) {
                        mapa.setView(ruta[ruta.length - 1]);
                        primeraCarga = false;
                    }
                })
                .catch(error => console.error("Error cargando recorrido:", error));
        }

        function actualizarUbicacion() {
            fetch("/api/ubicacion")
                .then(respuesta => respuesta.json())
                .then(datos => {
                    document.getElementById("latitud").textContent = datos.latitud ?? "---";
                    document.getElementById("longitud").textContent = datos.longitud ?? "---";
                    document.getElementById("fecha").textContent = datos.fecha ?? "---";
                    document.getElementById("hora").textContent = datos.hora ?? "---";

                    if (datos.latitud && datos.longitud) {
                        const nuevaPos = [datos.latitud, datos.longitud];
                        marcador.setLatLng(nuevaPos);
                        mapa.setView(nuevaPos);
                    }
                })
                .catch(error => console.error("Error:", error));
        }

        actualizarUbicacion();
        actualizarRecorrido();
        setInterval(actualizarUbicacion, 10000);
        setInterval(actualizarRecorrido, 10000);
    </script>
</body>
</html>
