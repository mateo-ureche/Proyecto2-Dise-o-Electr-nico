<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker - {{ dominio }}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            overflow: hidden;
        }
        .contenedor {
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }
        .encabezado {
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .encabezado h1 { margin: 0; font-size: 22px; }
        .encabezado p { margin-top: 4px; color: #64748b; font-size: 14px; }
        .datos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .campo {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
        }
        .etiqueta {
            display: block;
            color: #64748b;
            font-size: 11px;
            margin-bottom: 2px;
            font-weight: bold;
        }
        .valor { font-size: 15px; font-weight: bold; color: #0f172a; }
        .estado {
            text-align: center;
            margin-bottom: 10px;
            color: #64748b;
            font-size: 12px;
            flex-shrink: 0;
        }
        .punto {
            display: inline-block;
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
        }
        .controles-historico {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            flex-shrink: 0;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
        }
        .controles-historico label {
            font-size: 12px;
            color: #64748b;
            font-weight: bold;
        }
        .controles-historico input[type="datetime-local"] {
            font-size: 13px;
            padding: 4px 6px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .btn {
            font-size: 13px;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .btn-historico {
            background: #dc2626;
            color: white;
        }
        .btn-tiempo-real {
            background: #2563eb;
            color: white;
            display: none;
        }
        #mapa {
            flex: 1;
            min-height: 0;
            width: 100%;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <h1>📍 GPS Tracker</h1>
            <p>Ubicación en tiempo real del vehículo</p>
            <p style="font-size: 12px; color: #94a3b8;">{{ dominio }}</p>
        </div>

        <div class="datos">
            <div class="campo">
                <span class="etiqueta">LATITUD</span>
                <span class="valor" id="latitud">---</span>
            </div>
            <div class="campo">
                <span class="etiqueta">LONGITUD</span>
                <span class="valor" id="longitud">---</span>
            </div>
            <div class="campo">
                <span class="etiqueta">FECHA</span>
                <span class="valor" id="fecha">---</span>
            </div>
            <div class="campo">
                <span class="etiqueta">HORA</span>
                <span class="valor" id="hora">---</span>
            </div>
        </div>

        <div class="controles-historico">
            <label>Desde:</label>
            <input type="datetime-local" id="fechaInicio">
            <label>Hasta:</label>
            <input type="datetime-local" id="fechaFin">
            <button class="btn btn-historico" onclick="verHistorico()">Ver recorrido histórico</button>
            <button class="btn btn-tiempo-real" id="btnTiempoReal" onclick="volverTiempoReal()">Volver a tiempo real</button>
        </div>

        <div class="estado">
            <span class="punto"></span>
            Actualización automática cada 10 segundos
        </div>

        <div id="mapa"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let mapa = L.map('mapa').setView([10.9878, -74.7889], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(mapa);

        let marcador = L.marker([10.9878, -74.7889]).addTo(mapa);
        let lineaRecorrido = L.polyline([], { color: '#2563eb', weight: 4 }).addTo(mapa);
        let lineaHistorica = L.polyline([], { color: '#dc2626', weight: 4, dashArray: '8, 6' });
        let primeraCarga = true;
        let modoHistorico = false;

        function distanciaMetrosAprox(p1, p2) {
            const dLat = (p2[0] - p1[0]) * 111000;
            const dLon = (p2[1] - p1[1]) * 111000 * Math.cos(p1[0] * Math.PI / 180);
            return Math.sqrt(dLat * dLat + dLon * dLon);
        }

        function construirRutaFiltrada(puntosCrudos) {
            const ruta = [];
            let rechazosSeguidos = 0;
            for (const p of puntosCrudos) {
                const lat = Math.round(p.latitud * 10000) / 10000;
                const lon = Math.round(p.longitud * 10000) / 10000;
                const nuevoPunto = [lat, lon];
                const anterior = ruta[ruta.length - 1];

                if (!anterior) {
                    ruta.push(nuevoPunto);
                    continue;
                }

                const esDistinto = anterior[0] !== nuevoPunto[0] || anterior[1] !== nuevoPunto[1];
                if (!esDistinto) continue;

                const esRazonable = distanciaMetrosAprox(anterior, nuevoPunto) < 500;
                if (esRazonable) {
                    ruta.push(nuevoPunto);
                    rechazosSeguidos = 0;
                } else {
                    rechazosSeguidos++;
                    if (rechazosSeguidos >= 2) {
                        ruta.length = 0;
                        ruta.push(nuevoPunto);
                        rechazosSeguidos = 0;
                    }
                }
            }
            return ruta;
        }

        function construirRutaHistorica(puntosCrudos) {
            const puntosUnicos = [];
            for (const p of puntosCrudos) {
                const lat = Math.round(p.latitud * 10000) / 10000;
                const lon = Math.round(p.longitud * 10000) / 10000;
                const nuevoPunto = [lat, lon];
                const anterior = puntosUnicos[puntosUnicos.length - 1];
                if (!anterior || anterior[0] !== nuevoPunto[0] || anterior[1] !== nuevoPunto[1]) {
                    puntosUnicos.push(nuevoPunto);
                }
            }

            const segmentos = [[]];
            for (const p of puntosUnicos) {
                const segmentoActual = segmentos[segmentos.length - 1];
                const anterior = segmentoActual[segmentoActual.length - 1];
                if (anterior && distanciaMetrosAprox(anterior, p) >= 500) {
                    segmentos.push([p]);
                } else {
                    segmentoActual.push(p);
                }
            }

            let mejorSegmento = segmentos[0];
            for (const seg of segmentos) {
                if (seg.length > mejorSegmento.length) mejorSegmento = seg;
            }
            return mejorSegmento;
        }

        function dibujarRuta(ruta) {
            lineaRecorrido.setLatLngs(ruta);
        }

        function actualizarRecorrido() {
            if (modoHistorico) return;
            fetch("/api/recorrido")
                .then(r => r.json())
                .then(puntosCrudos => {
                    const ruta = construirRutaFiltrada(puntosCrudos);
                    dibujarRuta(ruta);

                    if (primeraCarga && ruta.length > 0) {
                        mapa.setView(ruta[ruta.length - 1]);
                        primeraCarga = false;
                    }
                })
                .catch(error => console.error("Error cargando recorrido:", error));
        }

        function actualizarUbicacion() {
            if (modoHistorico) return;
            fetch("/api/ubicacion")
                .then(respuesta => respuesta.json())
                .then(datos => {
                    document.getElementById("latitud").textContent = datos.latitud ?? "---";
                    document.getElementById("longitud").textContent = datos.longitud ?? "---";
                    document.getElementById("fecha").textContent = datos.fecha ?? "---";
                    document.getElementById("hora").textContent = datos.hora ?? "---";

                    if (datos.latitud && datos.longitud) {
                        const nuevaPos = [datos.latitud, datos.longitud];
                        marcador.setLatLng(nuevaPos);
                        mapa.setView(nuevaPos);
                    }
                })
                .catch(error => console.error("Error:", error));
        }

        function verHistorico() {
            const inicio = document.getElementById("fechaInicio").value;
            const fin = document.getElementById("fechaFin").value;

            if (!inicio || !fin) {
                alert("Selecciona una fecha de inicio y una de fin.");
                return;
            }

            fetch("/api/historico?inicio=" + encodeURIComponent(inicio) + "&fin=" + encodeURIComponent(fin))
                .then(r => r.json())
                .then(puntosCrudos => {
                    if (puntosCrudos.error) {
                        alert(puntosCrudos.error);
                        return;
                    }

                    const ruta = construirRutaHistorica(puntosCrudos);

                    if (ruta.length === 0) {
                        alert("No hay datos guardados en ese rango de fechas.");
                        return;
                    }

                    modoHistorico = true;
                    mapa.removeLayer(lineaRecorrido);
                    mapa.removeLayer(marcador);
                    lineaHistorica.setLatLngs(ruta);
                    lineaHistorica.addTo(mapa);
                    mapa.fitBounds(lineaHistorica.getBounds());
                    document.getElementById("btnTiempoReal").style.display = "inline-block";
                })
                .catch(error => console.error("Error cargando historico:", error));
        }

        function volverTiempoReal() {
            modoHistorico = false;
            mapa.removeLayer(lineaHistorica);
            lineaRecorrido.addTo(mapa);
            marcador.addTo(mapa);
            document.getElementById("btnTiempoReal").style.display = "none";
            actualizarUbicacion();
            actualizarRecorrido();
        }

        actualizarUbicacion();
        actualizarRecorrido();
        setInterval(actualizarUbicacion, 10000);
        setInterval(actualizarRecorrido, 10000);
    </script>
</body>
</html>
