<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GPS Tracker - {{ dominio }}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div id="mapa"></div>
 
    <div class="titulo-flotante" id="tituloFlotante">
        📍 GPS Tracker
        <span class="hora-flotante" id="horaFlotante">--/--/---- --:--:--</span>
    </div>
 
    <div class="barra-tiempo" id="barraTiempo">
        <div class="titulo-tiempo">📍 ¿Cuándo pasó? Mueve la barra</div>
        <div class="texto-tiempo" id="textoTiempo">--/--/---- · --:--:--</div>
        <input type="range" id="sliderTiempo" min="0" max="0" value="0">
    </div>

    <button class="toggle-btn" id="botonToggle" onclick="toggleSidebar()">☰</button>
 
    <div class="sidebar" id="sidebar">
        <div class="titulo-sidebar">📍 GPS Tracker</div>
 
        <div class="estado-vivo">
            <span class="punto"></span>
            Actualización cada 10 segundos
        </div>
 
        <div class="seccion">
            <div class="seccion-titulo">Ubicación actual</div>
            <div class="datos-grid">
                <div class="dato-item">
                    <span class="etiqueta">Latitud</span>
                    <span class="valor" id="latitud">---</span>
                </div>
                <div class="dato-item">
                    <span class="etiqueta">Longitud</span>
                    <span class="valor" id="longitud">---</span>
                </div>
                <div class="dato-item">
                    <span class="etiqueta">Fecha</span>
                    <span class="valor" id="fecha">---</span>
                </div>
                <div class="dato-item">
                    <span class="etiqueta">Hora</span>
                    <span class="valor" id="hora">---</span>
                </div>
            </div>
        </div>
 
        <div class="seccion">
            <div class="seccion-titulo">🗓️ Recorrido histórico</div>
            <label>Desde</label>
            <input type="text" class="campo-fecha" id="fechaInicio" placeholder="Selecciona fecha y hora">
            <label>Hasta</label>
            <input type="text" class="campo-fecha" id="fechaFin" placeholder="Selecciona fecha y hora">
            <button class="btn btn-ver" onclick="verHistorico()">Ver recorrido</button>
            <button class="btn btn-volver" id="btnTiempoReal" onclick="volverTiempoReal()">Volver a tiempo real</button>
            <div class="lista-recorridos" id="listaRecorridos"></div>
        </div>
    </div>
 
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/es.js"></script>
    <script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
    <script src="{{ url_for('static', filename='js/rutas.js') }}"></script>
    <script src="{{ url_for('static', filename='js/historico.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/polling.js') }}"></script>
</body>
</html>
